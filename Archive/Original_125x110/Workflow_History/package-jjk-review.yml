name: Package JJK Alarm design review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-jjk-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and original image provenance
        run: |
          python3 Tools/check_submission.py
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('CAD/Checks/Export_Recovery.json').read_text())
          assert r['keycaps']['step_reimport_valid'] is True
          assert r['keycaps']['step_reimport_solids']==4
          assert r['complete_clock_assembly_proven'] is False
          assert Path('Docs/REVIEW_REQUEST.md').is_file()
          assert Path('Production/gerbers.zip').is_file()
          for item in r['keycaps']['parts']:
              p=Path('Production/Case_Parts')/item['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          print('Current package and recovered keycap hashes verified; pending assembly status preserved.')
          PY
      - name: Archive this exact commit
        run: git archive --format=zip --output=/tmp/JJK_Alarm_Design_Review.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: JJK-Alarm-Current-Design-Review
          path: /tmp/JJK_Alarm_Design_Review.zip
