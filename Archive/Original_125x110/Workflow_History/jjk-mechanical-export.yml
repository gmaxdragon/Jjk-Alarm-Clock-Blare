name: JJK Alarm mechanical export repair
on:
  push:
    branches: [main]
    paths: ['Tools/finalize_mechanical_exports.py','Tools/export_mechanical_dimensions.py','.github/workflows/jjk-mechanical-export.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad and CAD conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common python3-venv
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad kicad-symbols kicad-footprints
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          python3 -m venv /tmp/jjk-cad
          /tmp/jjk-cad/bin/pip install -q 'cadquery==2.8.0' 'trimesh==4.11.1' numpy
      - name: Native source checks and exact PCB body export
        run: |
          set -euo pipefail
          mkdir -p CAD/Current_References CAD/Checks
          kicad-cli sch erc --severity-all --exit-code-violations -o CAD/Checks/ERC_After_Export.rpt PCB/jjkspeakerpcb.kicad_sch
          kicad-cli pcb drc --severity-all --schematic-parity --refill-zones --exit-code-violations -o CAD/Checks/DRC_After_Export.rpt PCB/jjkspeakerpcb.kicad_pcb
          kicad-cli pcb export step --no-components --cut-vias-in-body --force -o CAD/Current_References/PCB_Drilled_Body.step PCB/jjkspeakerpcb.kicad_pcb
          /usr/bin/python3 Tools/export_mechanical_dimensions.py
      - name: Reimport STEP models and export six closed keycap parts
        run: /tmp/jjk-cad/bin/python Tools/finalize_mechanical_exports.py
      - name: Check repository documentation and assets
        run: python3 Tools/check_submission.py
      - name: Upload corrected parts
        uses: actions/upload-artifact@v4
        with:
          name: JJK-Alarm-Corrected-Mechanical-Parts
          path: |
            CAD/JJK_Alarm_Corrected_Parts.zip
            CAD/Checks/
          if-no-files-found: error
      - name: Save verified outputs without changing PCB circuitry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- PCB/
          git add CAD/Current_References CAD/Checks CAD/Recovered/Original_Keycap_STL CAD/JJK_Alarm_Corrected_Parts.zip Production/Case_Parts
          if ! git diff --cached --quiet; then
            git commit -m 'Add native PCB dimensions and STEP body plus six validated keycap exports'
            git push
          fi
