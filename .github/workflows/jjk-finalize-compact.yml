name: Finalize JJK Alarm compact submission package
on:
  push:
    branches: [jjk-compact-revision]
    paths: [.github/workflows/jjk-finalize-compact.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import checked compact package and preserve original
        env:
          SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-aee0-8230-8bc0-9c577e2e1bfb/raw?se=2026-10-28T04%3A11%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=b6d8d5c7-6ef1-5d80-a06b-9558b17b1903&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-28T01%3A59%3A46Z&ske=2026-10-29T01%3A59%3A46Z&sks=b&skv=2026-02-06&sig=KZeVMjTwbEq8v3x%2BJIs9zAnVDcublMBIzq2vkKWOq5E%3D'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$SOURCE_URL" -o /tmp/jjk-final-patch.zip
          echo '7857dc4de392245f405a1c65b1a81acd16fec1b5fa14d15a4fe047e8c17a26ed  /tmp/jjk-final-patch.zip' | sha256sum -c -
          mkdir -p /tmp/jjk-final-patch
          python3 -m zipfile -e /tmp/jjk-final-patch.zip /tmp/jjk-final-patch
          python3 /tmp/jjk-final-patch/Tools/apply_compact_package.py --root . --patch /tmp/jjk-final-patch
          git diff --exit-code -- .github/workflows
          python3 Tools/check_submission.py
      - name: Install KiCad and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad kicad-symbols kicad-footprints python3-cairosvg python3-pil
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Fresh native electrical checks and actual PCB views
        run: |
          set -euo pipefail
          kicad-cli sch erc --severity-all --exit-code-violations -o Production/Checks/ERC.rpt PCB/jjkspeakerpcb.kicad_sch
          kicad-cli pcb drc --severity-all --schematic-parity --refill-zones --exit-code-violations -o Production/Checks/DRC.rpt PCB/jjkspeakerpcb.kicad_pcb
          kicad-cli pcb export svg --layers 'F.Cu,F.SilkS,Edge.Cuts' --exclude-drawing-sheet --mode-single --page-size-mode 2 -o Docs/Images/Compact/PCB_Front.svg PCB/jjkspeakerpcb.kicad_pcb
          kicad-cli pcb export svg --layers 'B.Cu,B.SilkS,Edge.Cuts' --exclude-drawing-sheet --mirror --mode-single --page-size-mode 2 -o Docs/Images/Compact/PCB_Back.svg PCB/jjkspeakerpcb.kicad_pcb
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageDraw,ImageFont
          p=Path('Docs/Images/Compact')
          for side in ('Front','Back'):
            cairosvg.svg2png(url=str(p/f'PCB_{side}.svg'),write_to=str(p/f'PCB_{side}.png'),output_width=900,output_height=900,background_color='#18212b')
          out=Image.new('RGB',(1840,970),'#18212b');out.paste(Image.open(p/'PCB_Front.png'),(10,55));out.paste(Image.open(p/'PCB_Back.png'),(930,55))
          d=ImageDraw.Draw(out);font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',25)
          d.text((24,15),'JJK Alarm compact 95 mm: FRONT',font=font,fill='white')
          d.text((944,15),'BACK (viewed from the back)',font=font,fill='white')
          out.save(p/'PCB_Layout.png')
          PY
          cat Production/Checks/ERC.rpt Production/Checks/DRC.rpt
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile real XIAO ESP32-C3 firmware and run logic tests
        run: |
          set -euo pipefail
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL"
          arduino-cli lib install 'Adafruit GFX Library@1.13.0'
          arduino-cli lib install 'Adafruit ST7735 and ST7789 Library@1.12.0'
          trap 'rm -f Firmware/JJK_Alarm/secrets.h' EXIT
          cp Firmware/JJK_Alarm/secrets.example.h Firmware/JJK_Alarm/secrets.h
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C3 --warnings all Firmware/JJK_Alarm 2>&1 | tee Production/Checks/Firmware_Compile.txt
          rm Firmware/JJK_Alarm/secrets.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic Tests/alarm_logic_tests.cpp -o /tmp/jjk-alarm
          /tmp/jjk-alarm | tee Production/Checks/Alarm_Tests.txt
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic Tests/time_tools_tests.cpp -o /tmp/jjk-time
          /tmp/jjk-time | tee Production/Checks/Timer_Tests.txt
          arduino-cli core list > Production/Checks/Arduino_Core.txt
          arduino-cli lib list > Production/Checks/Arduino_Libraries.txt
      - name: Final integrity and complete archive
        run: |
          set -euo pipefail
          python3 Tools/check_submission.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('.')
          old=json.loads((root/'Docs/Compact_Package_SHA256.json').read_text())
          for row in old:
            p=root/row['path']
            if p.exists():row['bytes']=p.stat().st_size;row['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'Docs/Compact_Package_SHA256.json').write_text(json.dumps(old,indent=2)+'\n')
          derived=[]
          for p in sorted((root/'Docs/Images/Compact').glob('*')):
            if p.is_file() and p.name!='manifest.json':derived.append({'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source':'Actual CAD geometry or native KiCad plot; not a physical photograph'})
          (root/'Docs/Images/Compact/manifest.json').write_text(json.dumps(derived,indent=2)+'\n')
          selected=['README.md','.gitignore','CAD','PCB','Firmware','Production','Docs','Tools','Tests','Archive/Original_125x110','.github/workflows/jjk-validation.yml']
          files=[]
          for rel in selected:
            p=root/rel
            files.extend([p] if p.is_file() else [q for q in p.rglob('*') if q.is_file()])
          files=sorted(set(p for p in files if '__pycache__' not in p.parts and p.name!='secrets.h'))
          manifest=root/'Docs/PUBLICATION_MANIFEST.json'
          manifest.write_text(json.dumps([{'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files if p!=manifest],indent=2)+'\n')
          dest=Path('/tmp/JJK_Alarm_Compact_Submission.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in files:z.write(p,p.as_posix())
          with zipfile.ZipFile(dest) as z:assert z.testzip() is None
          print('Complete current package:',len(files),'files;',dest.stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JJK-Alarm-Compact-Submission
          path: /tmp/JJK_Alarm_Compact_Submission.zip
          if-no-files-found: warn
      - name: Publish validated assets without workflow mutations
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish checked 95mm JJK Alarm PCB, full STEP and print parts; retain original 125mm version'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JJK-Compact-Final-Check-Reports
          path: Production/Checks/
          if-no-files-found: warn
