name: JJK Alarm compact source and build checks
on:
  push:
    branches: [main, jjk-compact-revision]
    paths: ['README.md','PCB/**','Firmware/**','Production/**','CAD/**','Tests/**','Tools/**','Docs/**','.github/workflows/jjk-validation.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tools/check_submission.py
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core and display libraries
        run: |
          set -euo pipefail
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32 --additional-urls "$URL"
          arduino-cli lib install 'Adafruit GFX Library'
          arduino-cli lib install 'Adafruit ST7735 and ST7789 Library'
      - name: Compile current JJK sketch with first-power defaults
        run: |
          set -euo pipefail
          trap 'rm -f Firmware/JJK_Alarm/secrets.h' EXIT
          cp Firmware/JJK_Alarm/secrets.example.h Firmware/JJK_Alarm/secrets.h
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C3 --warnings all Firmware/JJK_Alarm
      - name: Run alarm and timer tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic Tests/alarm_logic_tests.cpp -o /tmp/jjk-alarm
          /tmp/jjk-alarm
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic Tests/time_tools_tests.cpp -o /tmp/jjk-time
          /tmp/jjk-time
  kicad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad and standard libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad kicad-symbols kicad-footprints
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Native electrical and PCB checks
        run: |
          mkdir -p /tmp/jjk-reports
          kicad-cli sch erc --severity-all --exit-code-violations -o /tmp/jjk-reports/ERC.rpt PCB/jjkspeakerpcb.kicad_sch
          kicad-cli pcb drc --severity-all --schematic-parity --refill-zones --exit-code-violations -o /tmp/jjk-reports/DRC.rpt PCB/jjkspeakerpcb.kicad_pcb
          cat /tmp/jjk-reports/*.rpt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jjk-native-validation-reports
          path: /tmp/jjk-reports/
