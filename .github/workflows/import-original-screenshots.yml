name: Import original JJK Alarm screenshots
on:
  push:
    branches: [blare-rectangular-wip-20261026]
    paths: [.github/workflows/import-original-screenshots.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import the original attachment bytes
        env:
          TRANSFER_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-829c-81fd-a08b-7cc66ba011f9/raw?se=2026-10-27T23%3A58%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=bef3832f-0bf1-5f45-959a-bd072ff6a978&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T11%3A58%3A00Z&ske=2026-10-28T11%3A58%3A00Z&sks=b&skv=2026-02-06&sig=gQ1rI0QBBaZK6yCfMViOTt8ghhhL015xh3CBlC4qYgA%3D'
        run: |
          python3 - <<'PY'
          import os, urllib.request, hashlib, zipfile, io, json
          from pathlib import Path, PurePosixPath
          url=os.environ['TRANSFER_URL']
          print('::add-mask::'+url)
          data=urllib.request.urlopen(url, timeout=90).read()
          assert hashlib.sha256(data).hexdigest()=='59f71b505599b98441432183b34a5042c6aed23ad7bfabf22ea2aa1a1cf07380'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('Docs/Images/manifest.json'))
              assert len(manifest)==14
              for entry in manifest:
                  path=PurePosixPath(entry['path'])
                  assert str(path).startswith('Docs/Images/') and '..' not in path.parts
                  raw=z.read(str(path))
                  assert hashlib.sha256(raw).hexdigest()==entry['sha256']
                  target=Path(str(path)); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(raw)
              Path('Docs/Images/manifest.json').write_bytes(z.read('Docs/Images/manifest.json'))
          print('Imported 14 original screenshot/reference/artwork files; all original-byte hashes matched.')
          PY
      - name: Commit images and remove this one-use transport workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Images
          git rm .github/workflows/import-original-screenshots.yml
          git commit -m 'Archive user screenshots and provenance manifest, with no generated renders'
          git pull --rebase
          git push
