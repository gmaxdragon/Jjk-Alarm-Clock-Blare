name: GGK Alarm Rev C Engineering Gate
on:
  push:
    branches: [main, ggk-rev-d-audit-20261025]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-and-firmware:
    name: Router, Copper Connectivity, Fail-Closed Safety, Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python prerequisites
        run: |
          python3 -m pip install --break-system-packages --quiet 'shapely>=2.0,<3'
      - name: Regenerate schematic and physical copper from audited source
        run: |
          python3 build_board.py
          python3 make_libraries.py
      - name: Pin map, failsafe defaults, no internal battery assertions
        run: python3 Tests/check_pinmap_and_failsafe.py
      - name: Independent pad-to-pad copper path verification
        run: python3 Tests/independent_connectivity.py
      - name: Geometric routing and 0.2 mm clearance check
        run: python3 verify_board_geometry.py
      - name: C++ alarm-logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic Tests/alarm_logic_tests.cpp -o /tmp/ggk_alarm_logic
          /tmp/ggk_alarm_logic
      - name: Host-stub syntax check; not an Arduino-core compile
        run: |
          # Use an empty, safe config in CI. Never commit private credentials.
          cp Firmware/GGK_Alarm/secrets.example.h Firmware/GGK_Alarm/secrets.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -ITests/fake_arduino -x c++ -fsyntax-only Firmware/GGK_Alarm/GGK_Alarm.ino
      - name: Confirm manufacturing remains blocked
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('Docs/RELEASE_GATES.json'))
          assert r['release_approved'] is False
          assert r['power']['fully_unplugged_supported'] is False
          assert r['firmware']['arduino_esp32_real_compile'] is False
          print('DESIGN HOLD enforced; no Gerbers released')
          PY
  native-kicad:
    name: Native KiCad ERC + DRC — fabrication gate only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad
          kicad-cli version
          kicad-cli sch erc --help | grep -q "exit-code-violations"
          kicad-cli pcb drc --help | grep -q "exit-code-violations"
      - name: Diagnostic native PCB parser (non-fabrication)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys,traceback
          sys.path.insert(0, "/usr/lib/python3/dist-packages")
          try:
              import pcbnew
              print("PCBNEW version:",pcbnew.GetBuildVersion())
              try:
                  b=pcbnew.LoadBoard("PCB/jjkspeakerpcb.kicad_pcb")
                  print("NATIVE_LOAD_OK:",b.GetFootprints().GetCount())
              except Exception as e:
                  print("NATIVE_LOAD_ERROR:",repr(e))
                  traceback.print_exc()
          except Exception as e:
              print("PCBNEW_LIBRARY_ERROR", repr(e))
              traceback.print_exc()
          PY
      - name: Print KiCad file load diagnostics
        continue-on-error: true
        run: |
          kicad-cli pcb export svg -o /tmp/ggk-board.svg -l F.Cu PCB/jjkspeakerpcb.kicad_pcb || true
          kicad-cli pcb export gerbers -o /tmp/ggk-diagnostic-gerbers/ PCB/jjkspeakerpcb.kicad_pcb || true
      - name: Python routing dependencies
        run: python3 -m pip install --break-system-packages --quiet 'shapely>=2.0,<3'
      - name: Regenerate native PCB/schematic from the audited generator
        run: |
          python3 build_board.py
          python3 make_libraries.py
      - name: Native KiCad parser subset isolation
        continue-on-error: true
        run: python3 Tests/native_board_loader_diag.py
      - name: Inspect XIAO footprint geometry against the regenerated local library
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"/usr/lib/python3/dist-packages")
          import pcbnew
          b=pcbnew.LoadBoard("PCB/jjkspeakerpcb.kicad_pcb")
          u=next(f for f in b.GetFootprints() if f.GetReference()=="U1")
          lib=pcbnew.FootprintLoad("PCB/GGK.pretty","Seeed_XIAO_ESP32C3_Castellated")
          print("DIAG U1 board",u.GetPosition().x,u.GetPosition().y,"flipped",u.IsFlipped())
          print("DIAG U1 lib",bool(lib))
          if lib:
            lib.SetPosition(u.GetPosition())
            lib.Flip(u.GetPosition(),False)
            actual={p.GetNumber():(p.GetPosition().x,p.GetPosition().y,p.GetLayerSet().FmtBin(),p.GetShape()) for p in u.Pads()}
            expected={p.GetNumber():(p.GetPosition().x,p.GetPosition().y,p.GetLayerSet().FmtBin(),p.GetShape()) for p in lib.Pads()}
            print("DIAG COUNTS",len(actual),len(expected))
            for i in sorted(set(actual)|set(expected),key=lambda n:int(n)):
              if actual.get(i)!=expected.get(i):print("PAD DIFFERENCE",i,actual.get(i),expected.get(i))
            print("U1 ACTUAL GRAPHICS",[(type(g).__name__,str(g.GetClass())) for g in u.GraphicalItems()])
            print("U1 LIB GRAPHICS",[(type(g).__name__,str(g.GetClass())) for g in lib.GraphicalItems()])
          PY
      - name: Regenerate KiCad from corrected physical pad coordinates
        run: |
          python3 -m pip install --break-system-packages --quiet 'shapely>=2.0,<3' numpy
          python3 build_board.py
          python3 Tests/native_pad_position_gate.py
      - name: Save regenerated source files to audit branch only
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/ggk-rev-d-audit-20261025'
        run: |
          git add PCB/jjkspeakerpcb.kicad_pcb PCB/jjkspeakerpcb.kicad_sch PCB/jjkspeakerpcb.kicad_pro Docs/generator_report.json Docs/physical_pad_map.json
          if git diff --cached --quiet; then
            echo 'Generated design already synchronized'
          else
            git config user.name "ggk-hardware-audit"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate PCB and schematic using KiCad backside coordinates"
            git push origin HEAD:ggk-rev-d-audit-20261025
          fi
      - name: Native KiCad schematic ERC
        id: erc
        continue-on-error: true
        run: |
          set +e
          kicad-cli sch erc -o ggk-erc.rpt --severity-all --exit-code-violations PCB/jjkspeakerpcb.kicad_sch
          result=$?
          echo "----- NATIVE ERC VIOLATION REPORT -----"
          if [ -f ggk-erc.rpt ]; then cat ggk-erc.rpt; else echo "ERC report missing"; fi
          exit "$result"
      - name: Native KiCad PCB DRC (filled zones must be checked separately)
        id: drc
        continue-on-error: true
        run: |
          set +e
          kicad-cli pcb drc -o ggk-drc.rpt --severity-all --schematic-parity --exit-code-violations PCB/jjkspeakerpcb.kicad_pcb
          result=$?
          echo "----- NATIVE DRC VIOLATION REPORT -----"
          if [ -f ggk-drc.rpt ]; then cat ggk-drc.rpt; else echo "DRC report missing"; fi
          exit "$result"
      - name: Fail manufacturing gate if either check fails
        if: always()
        run: |
          test "${{ steps.erc.outcome }}" = success
          test "${{ steps.drc.outcome }}" = success
      - name: Always upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggk-native-kicad-reports
          path: |
            ggk-erc.rpt
            ggk-drc.rpt
          if-no-files-found: ignore
