name: BLARE Rectangular PCB - native Gerber review package
on:
  push:
    branches: [blare-rectangular-wip-20261026]
    paths:
      - PCB/jjkspeakerpcb.kicad_pcb
      - PCB/jjkspeakerpcb.kicad_sch
      - PCB/jjkspeakerpcb.kicad_pro
      - Production/GENERATE_GERBERS.sh
      - .github/workflows/blare-preview-gerbers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-gerbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install matching KiCad 10
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad
          kicad-cli version
      - name: Generate manufacturing preview and check schematic/PCB
        run: bash Production/GENERATE_GERBERS.sh
      - name: Save manufacturing review report
        run: |
          {
            echo "# BLARE rectangular PCB Gerber preview"
            echo
            echo "**NOT APPROVED FOR FABRICATION.**"
            echo
            echo "Source: PCB/jjkspeakerpcb.kicad_pcb and matching .kicad_sch in this branch."
            echo "Generated by KiCad 10 from the rectangular 125 x 110 mm user CAD."
            echo "The archive gerbers.zip contains the copper, solder mask, silkscreen, edge cuts,"
            echo "and plated/non-plated Excellon drill layers."
            echo
            echo "Native ERC/DRC reports must pass, but physical verification remains outstanding:"
            echo "TFT module pin order, buzzer 7.6 mm pin pitch/electrical type, XIAO sockets"
            echo "USB-C/antenna, M3 fasteners, assembly solder quality, power and thermal tests."
            echo
            echo "Do not order until a human has checked the Gerber preview at the manufacturer."
          } > Production/ReviewOnly/READ_FIRST_NOT_APPROVED.md
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blare-rectangular-gerber-review
          path: |
            Production/ReviewOnly/gerbers.zip
            Production/ReviewOnly/READ_FIRST_NOT_APPROVED.md
            Production/ReviewOnly/native_erc.rpt
            Production/ReviewOnly/native_drc.rpt
            Production/ReviewOnly/drill_report.rpt
      - name: Commit reviewed preview (not README, not main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Production/ReviewOnly/gerbers.zip Production/ReviewOnly/READ_FIRST_NOT_APPROVED.md Production/ReviewOnly/native_erc.rpt Production/ReviewOnly/native_drc.rpt Production/ReviewOnly/drill_report.rpt
          if git diff --cached --quiet; then echo "Preview unchanged"; else
            git commit -m "Generate KiCad 10 review-only Gerber + drill package (fabrication hold)"
            git push
          fi
